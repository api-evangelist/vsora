name: VSORA
description: 'VSORA is a French fabless semiconductor company headquartered in Meudon-La-Foret,
  France, that designs high-performance AI inference chips. Its Jotunn 8 data-center
  inference chip (3200 Tflops fp8, 288 GB HBM, built on TSMC 5nm) targets cost- and
  energy-efficient large-scale AI inference, and its Tyr family (Tyr 2, Tyr 4) targets
  edge AI and on-device processing. VSORA is a Partech portfolio company and publishes
  no public web API or developer portal as of July 2026.'
